<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">AI coding tools timeline</title>
  <desc id="desc">A proportional timeline from GitHub Copilot to ChatGPT to Claude Code to today in June 2026.</desc>
  <defs>
    <style>
      .axis { stroke: #9a9a92; stroke-width: 5; stroke-linecap: round; }
      .tick { stroke: #c5c5bd; stroke-width: 2; }
      .milestone { fill: #333333; }
      .year { fill: #777770; font: 18px Arial, sans-serif; }
      .date { fill: #4a4a45; font: 21px Arial, sans-serif; }
      .type { fill: #151515; font: 700 28px Arial, sans-serif; }
      .product { fill: #4f4f49; font: 22px Arial, sans-serif; }
    </style>
  </defs>

  <line class="axis" x1="130" y1="130" x2="1030" y2="130"/>

  <line class="tick" x1="130" y1="107" x2="130" y2="153"/>
  <text class="year" x="130" y="185" text-anchor="middle">2021</text>
  <line class="tick" x1="296" y1="107" x2="296" y2="153"/>
  <text class="year" x="296" y="185" text-anchor="middle">2022</text>
  <line class="tick" x1="462" y1="107" x2="462" y2="153"/>
  <text class="year" x="462" y="185" text-anchor="middle">2023</text>
  <line class="tick" x1="628" y1="107" x2="628" y2="153"/>
  <text class="year" x="628" y="185" text-anchor="middle">2024</text>
  <line class="tick" x1="795" y1="107" x2="795" y2="153"/>
  <text class="year" x="795" y="185" text-anchor="middle">2025</text>
  <line class="tick" x1="961" y1="107" x2="961" y2="153"/>
  <text class="year" x="961" y="185" text-anchor="middle">2026</text>

  <g transform="translate(211 0)">
    <circle class="milestone" cx="0" cy="130" r="17"/>
    <text class="date" x="0" y="45" text-anchor="middle">June 2021</text>
    <text class="type" x="0" y="78" text-anchor="middle">Autocomplete</text>
    <text class="product" x="0" y="108" text-anchor="middle">GitHub Copilot</text>
  </g>

  <g transform="translate(448 0)">
    <circle class="milestone" cx="0" cy="130" r="17"/>
    <text class="date" x="0" y="45" text-anchor="middle">November 2022</text>
    <text class="type" x="0" y="78" text-anchor="middle">Chatbot</text>
    <text class="product" x="0" y="108" text-anchor="middle">ChatGPT</text>
  </g>

  <g transform="translate(820 0)">
    <circle class="milestone" cx="0" cy="130" r="17"/>
    <text class="date" x="0" y="45" text-anchor="middle">February 2025</text>
    <text class="type" x="0" y="78" text-anchor="middle">Coding agent</text>
    <text class="product" x="0" y="108" text-anchor="middle">Claude Code</text>
  </g>

  <g transform="translate(1030 0)">
    <circle class="milestone" cx="0" cy="130" r="17"/>
    <text class="date" x="0" y="45" text-anchor="middle">June 2026</text>
    <text class="type" x="0" y="78" text-anchor="middle">Now</text>
  </g>
</svg>
