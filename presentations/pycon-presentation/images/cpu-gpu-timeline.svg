<svg viewBox="0 -25 900 305" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#626468"/>
    </marker>
  </defs>

  <text x="10" y="70"  font-size="20" font-weight="700" fill="#232323">GPU</text>
  <text x="10" y="210" font-size="20" font-weight="700" fill="#232323">CPU</text>

  <line x1="70" y1="65"  x2="880" y2="65"  stroke="#C0C1C3" stroke-width="2"/>
  <line x1="70" y1="205" x2="880" y2="205" stroke="#C0C1C3" stroke-width="2"/>

  <g stroke="#626468" stroke-width="1" stroke-dasharray="3,3">
    <line x1="150" y1="45" x2="150" y2="230"/>
    <line x1="225" y1="45" x2="225" y2="230"/>
    <line x1="300" y1="45" x2="300" y2="230"/>
    <line x1="375" y1="45" x2="375" y2="230"/>
    <line x1="450" y1="45" x2="450" y2="230"/>
  </g>

  <!-- GPU ops (top) -->
  <rect x="195" y="45" width="130" height="40" rx="4" fill="#0F1987"/>
  <text x="260" y="70" font-size="13" fill="#ffffff" text-anchor="middle">zero_grad</text>

  <rect x="330" y="45" width="130" height="40" rx="4" fill="#0F1987"/>
  <text x="395" y="70" font-size="13" fill="#ffffff" text-anchor="middle">forward</text>

  <rect x="465" y="45" width="130" height="40" rx="4" fill="#0F1987"/>
  <text x="530" y="70" font-size="13" fill="#ffffff" text-anchor="middle">loss_fn</text>

  <rect x="600" y="45" width="130" height="40" rx="4" fill="#0F1987"/>
  <text x="665" y="70" font-size="13" fill="#ffffff" text-anchor="middle">backward</text>

  <rect x="735" y="45" width="130" height="40" rx="4" fill="#0F1987"/>
  <text x="800" y="70" font-size="13" fill="#ffffff" text-anchor="middle">opt.step</text>

  <!-- CPU ops (bottom) -->
  <rect x="80"  y="185" width="70" height="40" rx="4" fill="#00883A"/>
  <text x="115" y="210" font-size="13" fill="#ffffff" text-anchor="middle">zero_grad</text>

  <rect x="155" y="185" width="70" height="40" rx="4" fill="#00883A"/>
  <text x="190" y="210" font-size="13" fill="#ffffff" text-anchor="middle">forward</text>

  <rect x="230" y="185" width="70" height="40" rx="4" fill="#00883A"/>
  <text x="265" y="210" font-size="13" fill="#ffffff" text-anchor="middle">loss_fn</text>

  <rect x="305" y="185" width="70" height="40" rx="4" fill="#00883A"/>
  <text x="340" y="210" font-size="13" fill="#ffffff" text-anchor="middle">backward</text>

  <rect x="380" y="185" width="70" height="40" rx="4" fill="#00883A"/>
  <text x="415" y="210" font-size="13" fill="#ffffff" text-anchor="middle">opt.step</text>

  <!-- Dispatch arrows CPU (bottom) -> GPU (top) -->
  <line x1="150" y1="185" x2="195" y2="85" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="225" y1="185" x2="330" y2="85" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="185" x2="465" y2="85" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="375" y1="185" x2="600" y2="85" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="185" x2="735" y2="85" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="430" y="268" font-size="15" fill="#626468" text-anchor="end">Time</text>
  <line x1="438" y1="263" x2="470" y2="263" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>

  <path d="M150,38 L150,32 L195,32 L195,38" stroke="#626468" stroke-width="1.2" fill="none"/>
  <line x1="172.5" y1="32" x2="172.5" y2="22" stroke="#626468" stroke-width="1.2"/>
  <text x="172.5" y="17" font-size="16" fill="#626468" text-anchor="middle" font-style="italic">pytorch op launch overhead</text>
</svg>
