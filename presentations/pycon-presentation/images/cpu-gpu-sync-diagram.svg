<svg viewBox="0 -25 900 325" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#626468"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D71919"/>
    </marker>
  </defs>

  <text x="10" y="70"  font-size="20" font-weight="700" fill="#232323">GPU</text>
  <text x="10" y="210" font-size="20" font-weight="700" fill="#232323">CPU</text>

  <line x1="70" y1="65"  x2="880" y2="65"  stroke="#C0C1C3" stroke-width="2"/>
  <line x1="70" y1="205" x2="880" y2="205" stroke="#C0C1C3" stroke-width="2"/>

  <g stroke="#626468" stroke-width="1" stroke-dasharray="3,3">
    <line x1="150" y1="45" x2="150" y2="230"/>
    <line x1="225" y1="45" x2="225" y2="230"/>
    <line x1="505" y1="45" x2="505" y2="230"/>
    <line x1="575" y1="45" x2="575" y2="230"/>
  </g>

  <!-- GPU ops (top) -->
  <rect x="195" y="45" width="130" height="40" rx="4" fill="#0F1987"/>
  <text x="260" y="70" font-size="14" fill="#ffffff" text-anchor="middle">op1</text>

  <rect x="330" y="45" width="130" height="40" rx="4" fill="#0F1987"/>
  <text x="395" y="70" font-size="14" fill="#ffffff" text-anchor="middle">op2</text>

  <!-- GPU idle region -->
  <rect x="465" y="45" width="155" height="40" rx="4" fill="#F5F5F5" stroke="#D71919" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="542" y="70" font-size="14" fill="#D71919" text-anchor="middle" font-style="italic">GPU idle</text>

  <rect x="620" y="45" width="130" height="40" rx="4" fill="#0F1987"/>
  <text x="685" y="70" font-size="14" fill="#ffffff" text-anchor="middle">op3</text>

  <!-- CPU ops (bottom) -->
  <rect x="80"  y="185" width="70" height="40" rx="4" fill="#00883A"/>
  <text x="115" y="210" font-size="14" fill="#ffffff" text-anchor="middle">op1</text>

  <rect x="155" y="185" width="70" height="40" rx="4" fill="#00883A"/>
  <text x="190" y="210" font-size="14" fill="#ffffff" text-anchor="middle">op2</text>

  <!-- CPU blocked region -->
  <rect x="230" y="185" width="270" height="40" rx="4" fill="#F5F5F5" stroke="#D71919" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="365" y="210" font-size="14" fill="#D71919" text-anchor="middle" font-style="italic">CPU blocked — waiting</text>

  <rect x="505" y="185" width="70" height="40" rx="4" fill="#00883A"/>
  <text x="540" y="210" font-size="14" fill="#ffffff" text-anchor="middle">op3</text>

  <!-- Dispatch arrows CPU (bottom) -> GPU (top) -->
  <line x1="150" y1="185" x2="195" y2="85" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="225" y1="185" x2="330" y2="85" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="575" y1="185" x2="620" y2="85" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sync arrow GPU -> CPU (op2 result comes back) -->
  <line x1="460" y1="85" x2="505" y2="185" stroke="#D71919" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="478" y="145" font-size="14" fill="#D71919" text-anchor="start" font-weight="600">sync!</text>

  <!-- op launch overhead brackets (above GPU row) -->
  <path d="M150,38 L150,32 L195,32 L195,38" stroke="#626468" stroke-width="1.2" fill="none"/>
  <line x1="172.5" y1="32" x2="172.5" y2="22" stroke="#626468" stroke-width="1.2"/>
  <text x="172.5" y="17" font-size="14" fill="#626468" text-anchor="middle" font-style="italic">op launch overhead</text>

  <path d="M575,38 L575,32 L620,32 L620,38" stroke="#626468" stroke-width="1.2" fill="none"/>
  <line x1="597.5" y1="32" x2="597.5" y2="22" stroke="#626468" stroke-width="1.2"/>
  <text x="597.5" y="17" font-size="14" fill="#626468" text-anchor="middle" font-style="italic">op launch overhead</text>

  <!-- GPU→CPU sync overhead bracket -->
  <path d="M460,232 L460,238 L505,238 L505,232" stroke="#D71919" stroke-width="1.2" fill="none"/>
  <line x1="482.5" y1="238" x2="482.5" y2="246" stroke="#D71919" stroke-width="1.2"/>
  <text x="482.5" y="262" font-size="14" fill="#D71919" text-anchor="middle" font-style="italic">GPU→CPU overhead</text>

  <!-- Time axis -->
  <text x="820" y="268" font-size="15" fill="#626468" text-anchor="end">Time</text>
  <line x1="828" y1="263" x2="860" y2="263" stroke="#626468" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
